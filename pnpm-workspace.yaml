packages:
  - packages/*
  - tooling

# Falla la instalación si Node no cumple `engines` (Node 24, design.md §7).
engineStrict: true

minimumReleaseAgeExclude:
  - '@fission-ai/openspec@1.14.0'
  - '@vitest/coverage-v8@5.0.3'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3

# Versiones compartidas por los paquetes (`"catalog:"` en su package.json).
catalog:
  '@eslint/js': 10.0.1
  '@mantine/core': 9.6.3
  '@mantine/hooks': 9.6.3
  '@types/node': 24.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  '@vitest/coverage-v8': 5.0.3
  eslint-plugin-react-hooks: 7.1.1
  eslint: 10.11.0
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.2.0
  globals: 17.12.0
  react-dom: 19.3.0
  react: 19.3.0
  typescript-eslint: 8.71.0
  typescript: 6.0.3
  vite: 8.3.1
  vitest: 5.0.3

allowBuilds:
  unrs-resolver: false
