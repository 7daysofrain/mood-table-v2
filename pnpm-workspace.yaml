packages:
  - packages/*
  - tooling
  - e2e

# Falla la instalación si Node no cumple `engines` (Node 24, design.md §7).
engineStrict: true

# Cadena de suministro: no se instala nada publicado hace menos de un día (en minutos). Declararlo
# activa el modo estricto: si no hay versión con esa antigüedad, la instalación falla en lugar de
# saltarse la regla. Dependabot espera más (`cooldown` en .github/dependabot.yml).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Versiones compartidas por los paquetes (`"catalog:"` en su package.json).
catalog:
  '@eslint/js': 10.0.1
  '@fastify/static': 10.1.10
  '@fastify/swagger': 9.9.3
  '@fastify/type-provider-typebox': 6.3.0
  '@fastify/websocket': 11.3.7
  '@langchain/core': 1.3.6
  '@langchain/langgraph': 1.7.3
  '@langchain/langgraph-cli': 1.7.1
  '@langchain/typesafe': 0.0.2
  '@linear/sdk': 99.0.0
  '@mantine/core': 9.8.0
  '@mantine/hooks': 9.8.0
  '@playwright/test': 1.65.0
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/ws': 8.18.2
  '@vitejs/plugin-react': 6.3.0
  '@vitest/coverage-v8': 5.1.0
  eslint-plugin-react-hooks: 7.1.1
  eslint: 10.14.0
  fastify: 5.12.8
  fft.js: 4.0.4
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.4.2
  globals: 17.14.0
  jsdom: 30.1.3
  octokit: 5.0.5
  react-dom: 19.3.1
  react: 19.3.1
  serialport: 13.0.0
  # ShellCheck en `pnpm lint` (deploy/*.sh): descarga el binario la primera vez que se ejecuta, sin
  # script de instalación (design.md del change table-install, decisión 8).
  shellcheck: 4.1.0
  typescript-eslint: 8.72.2
  typebox: 1.4.6
  typescript: 6.0.3
  vite: 8.3.7
  vitest: 5.1.0
  zod: 4.6.7

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  # Trae binarios precompilados para linux-arm64 (la Pi) y macOS: no compila nada al instalar
  # (decisión 1 del change adalight-strip-output).
  '@serialport/bindings-cpp': false
  unrs-resolver: false
