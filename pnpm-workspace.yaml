packages:
  - packages/*
  - tooling
  - e2e

# Falla la instalación si Node no cumple `engines` (Node 24, design.md §7).
engineStrict: true

# Cadena de suministro: no se instala nada publicado hace menos de un día (en minutos). Declararlo
# activa el modo estricto: si no hay versión con esa antigüedad, la instalación falla en lugar de
# saltarse la regla. Dependabot espera más (`cooldown` en .github/dependabot.yml).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Versiones compartidas por los paquetes (`"catalog:"` en su package.json).
catalog:
  '@eslint/js': 10.0.1
  '@fastify/static': 10.1.6
  '@fastify/websocket': 11.3.4
  '@mantine/core': 9.7.3
  '@mantine/hooks': 9.7.3
  '@playwright/test': 1.64.1
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/node': 26.6.5
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/ws': 8.18.2
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  eslint-plugin-react-hooks: 7.1.1
  eslint: 10.13.0
  fastify: 5.12.7
  fft.js: 4.0.4
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.2.0
  globals: 17.13.0
  jsdom: 30.1.3
  react-dom: 19.3.1
  react: 19.3.1
  typescript-eslint: 8.71.2
  typebox: 1.4.2
  typescript: 6.0.3
  vite: 8.3.4
  vitest: 5.0.5

allowBuilds:
  unrs-resolver: false
