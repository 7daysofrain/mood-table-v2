packages:
  - packages/*
  - tooling

# Falla la instalación si Node no cumple `engines` (Node 24, design.md §7).
engineStrict: true

minimumReleaseAgeExclude:
  - '@fission-ai/openspec@1.14.0'

# Versiones compartidas por los paquetes (`"catalog:"` en su package.json).
catalog:
  '@types/node': 24.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  vite: 8.3.1
