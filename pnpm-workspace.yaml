packages:
  - packages/*
  - tooling
  - e2e

# Falla la instalación si Node no cumple `engines` (Node 24, design.md §7).
engineStrict: true

# Cadena de suministro: no se instala nada publicado hace menos de un día (en minutos). Declararlo
# activa el modo estricto: si no hay versión con esa antigüedad, la instalación falla en lugar de
# saltarse la regla. Dependabot espera más (`cooldown` en .github/dependabot.yml).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

# Versiones compartidas por los paquetes (`"catalog:"` en su package.json).
catalog:
  '@eslint/js': 10.0.1
  '@fastify/static': 10.1.8
  '@fastify/swagger': 9.9.3
  '@fastify/type-provider-typebox': 6.3.0
  '@fastify/websocket': 11.3.6
  '@langchain/core': 1.3.2
  '@langchain/langgraph': 1.6.0
  '@langchain/langgraph-cli': 1.5.7
  '@langchain/typesafe': 0.0.2
  '@linear/sdk': 99.0.0
  '@mantine/core': 9.7.4
  '@mantine/hooks': 9.7.4
  '@playwright/test': 1.64.1
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/node': 26.6.6
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@types/ws': 8.18.2
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-v8': 5.0.5
  eslint-plugin-react-hooks: 7.1.1
  eslint: 10.14.0
  fastify: 5.12.7
  fft.js: 4.0.4
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.4.0
  globals: 17.14.0
  jsdom: 30.1.3
  octokit: 5.0.5
  react-dom: 19.3.1
  react: 19.3.1
  typescript-eslint: 8.72.1
  typebox: 1.4.3
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  unrs-resolver: false
