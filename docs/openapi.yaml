openapi: 3.1.0
info:
  title: Mood Table · API del motor
  description: "Los mandos del instrumento. El estado (las tiras, su efecto
    activo, los frames) llega por el WebSocket del visor:
    docs/instructions/viewer-protocol.md."
  version: 1.0.0
components:
  schemas: {}
paths:
  /api/strips/{stripId}/effect:
    put:
      summary: Cambia el efecto de una tira
      tags:
        - tiras
      description: La tira pasa a pintarse con el efecto desde el pulso siguiente, con
        un corte seco, y todos los paneles reciben las tiras por el WebSocket
        del visor. Elegir el efecto que ya tiene no lo reinicia.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - effect
              properties:
                effect:
                  anyOf:
                    - type: string
                      enum:
                        - breathing
                    - type: string
                      enum:
                        - energy
              additionalProperties: false
      parameters:
        - schema:
            type: string
          in: path
          name: stripId
          required: true
          description: El `id` de la tira
      responses:
        "200":
          description: La tira, con su efecto activo
          content:
            application/json:
              schema:
                description: La tira, con su efecto activo
                type: object
                required:
                  - id
                  - name
                  - ledCount
                  - output
                  - effect
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                  ledCount:
                    type: integer
                    minimum: 1
                  output:
                    anyOf:
                      - type: object
                        required:
                          - type
                        properties:
                          type:
                            type: string
                            enum:
                              - virtual
                        additionalProperties: false
                  effect:
                    anyOf:
                      - type: string
                        enum:
                          - breathing
                      - type: string
                        enum:
                          - energy
                additionalProperties: false
        "400":
          description: El cuerpo no es válido o el efecto no existe
          content:
            application/json:
              schema:
                description: El cuerpo no es válido o el efecto no existe
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    minLength: 1
                additionalProperties: false
        "404":
          description: La tira no existe
          content:
            application/json:
              schema:
                description: La tira no existe
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    minLength: 1
                additionalProperties: false
        "409":
          description: El efecto necesita fuente de audio y no hay
          content:
            application/json:
              schema:
                description: El efecto necesita fuente de audio y no hay
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    minLength: 1
                additionalProperties: false
