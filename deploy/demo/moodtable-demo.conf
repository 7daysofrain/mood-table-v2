# Drop-in de moodtable.service, solo en la demo pública (D125). deploy/demo/setup.sh lo copia a
# /etc/systemd/system/moodtable.service.d/demo.conf.
# La mesa sigue con Restart=no (D106): allí el DJ apaga y enciende. En la demo no hay nadie que lo
# haga, así que, si el motor se cae, systemd lo vuelve a arrancar.

[Service]
Restart=on-failure
RestartSec=5
