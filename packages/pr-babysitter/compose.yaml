# El PR Babysitter en una máquina de casa (D66): `docker compose up -d` desde esta carpeta, con el
# `.env` al lado. No abre ningún puerto: consulta GitHub, le pide la revisión de cada PR y publica en
# Linear.
services:
  pr-babysitter:
    build:
      context: ../..
      dockerfile: packages/pr-babysitter/Dockerfile
    env_file: .env
    restart: unless-stopped
