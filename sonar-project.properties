# Análisis de SonarQube Cloud (specs/quality-gates, design.md §6). Lo lanza el job `test` de la CI
# con el informe de cobertura de Vitest.
sonar.organization=7daysofrain
sonar.projectKey=7daysofrain_mood-table-v2

# `.claude/hooks/` es código del arnés (hooks de Claude Code), con sus tests en `tooling/`.
# `tooling/ci/` es código de la CI que decide si una PR entra, y `tooling/dev/`, el de `pnpm dev`:
# se analizan como el del producto.
sonar.sources=packages,.claude/hooks,tooling/ci,tooling/dev
# `packages/*/test/` son utilidades de test (setup y render del panel, ficheros de prueba del motor y
# el script que los genera), no código del producto: cuentan como tests. Vitest ya no las cubre porque
# su `coverage.include` es solo `packages/*/src/**`.
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/dist/**,packages/*/test/**
# `e2e/` son los E2E de Playwright y su configuración: se analizan como tests, y no entran en la
# cobertura porque no instrumentan el build (change e2e-playwright-gate, design.md decisión 4).
sonar.tests=packages,tooling,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,packages/*/test/**,e2e/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mantener igual que `coverage.exclude` en vitest.config.ts.
sonar.coverage.exclusions=packages/engine/src/main.ts,packages/panel/src/main.tsx,packages/pr-babysitter/src/main.ts,packages/pr-babysitter/src/studio.ts,**/*.hardware.ts,.claude/hooks/validate-ac.ts,tooling/ci/check-sonar-issues.ts,tooling/dev/prepare-local-config.ts
