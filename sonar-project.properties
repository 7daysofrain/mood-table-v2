# Análisis de SonarQube Cloud (specs/quality-gates, design.md §6). Lo lanza el job `test` de la CI
# con el informe de cobertura de Vitest.
sonar.organization=7daysofrain
sonar.projectKey=7daysofrain_mood-table-v2

sonar.sources=packages
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/dist/**
sonar.tests=packages,tooling
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mantener igual que `coverage.exclude` en vitest.config.ts.
sonar.coverage.exclusions=packages/engine/src/main.ts,packages/panel/src/main.tsx,**/*.hardware.ts
