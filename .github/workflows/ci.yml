# Puertas de cada cambio (specs/quality-gates, design.md §6): lint, tipos y tests en jobs
# separados, para que la PR diga qué ha fallado y cada uno pueda ser una comprobación requerida.
# En las PR contra `main`, `sonar-issues` falla si SonarQube encuentra incidencias nuevas (change
# tasks-to-main-pr-gates, design.md decisión 2): el quality gate gratuito no las tiene en cuenta.
name: CI

on:
  pull_request:
    branches: [main, 'feature/entrega-*']
  push:
    branches: [main, 'feature/entrega-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube necesita el historial para saber qué es código nuevo.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage

      # El resultado del quality gate lo publica SonarQube Cloud en la PR como su propia comprobación.
      # Sin el secreto (PR desde un fork) no se analiza.
      - name: Análisis de SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

      # Dice a `sonar-issues` qué análisis esperar (`ceTaskUrl`), el servidor y el proyecto.
      - name: Guardar el informe del análisis
        if: env.SONAR_TOKEN != '' && github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-report-task
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Solo contra `main`: en el plan gratuito, SonarQube no da los datos de las PR contra otras ramas.
  # Saltado por el `if`, GitHub lo da por superado como comprobación requerida (la PR de la foto de
  # una entrega). Sin el secreto (PR desde un fork) no hay análisis que consultar.
  sonar-issues:
    needs: test
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    # Red de seguridad: el script ya corta la espera a los 5 minutos.
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # El script solo usa módulos de Node: no hace falta instalar dependencias.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v8
        if: env.SONAR_TOKEN != ''
        with:
          name: sonar-report-task
          path: sonar

      - name: Incidencias nuevas de SonarQube
        if: env.SONAR_TOKEN != ''
        run: node tooling/ci/check-sonar-issues.ts
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_REPORT_TASK: sonar/report-task.txt
